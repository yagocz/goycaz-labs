name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# El sitio se despliega en la maquina propia (Astro SSR bajo pm2, expuesto por
# cloudflared), asi que GitHub no puede publicarlo: no alcanza ese host.
# Este workflow solo verifica que el proyecto compile en limpio.
# Para desplegar: `npm run deploy` en la maquina.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
